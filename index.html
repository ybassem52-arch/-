<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monito - مونيتو</title>
    <style>
        :root { 
            --bg: #f4f7fe; 
            --card-bg: #ffffff; 
            --text-main: #1a202c; 
            --accent: #3b82f6; 
            --secondary: #10b981;
            --danger: #ef4444;
        }
        [data-theme="dark"] { 
            --bg: #1a202c; 
            --card-bg: #2d3748; 
            --text-main: #f7fafc; 
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; padding: 20px; transition: 0.3s; 
        }

        .card { 
            max-width: 450px; margin: auto; background: var(--card-bg); 
            padding: 30px; border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            text-align: center; border: 1px solid rgba(0,0,0,0.05);
        }

        h1 { 
            font-size: 32px; color: var(--accent); margin-bottom: 2px; 
            font-weight: 800; letter-spacing: -1px;
        }

        .theme-btn { 
            background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent); 
            color: var(--accent); padding: 6px 16px; border-radius: 20px; 
            cursor: pointer; font-size: 13px; margin: 10px auto 20px auto;
            display: inline-block; transition: 0.2s;
        }
        .theme-btn:hover { background: var(--accent); color: white; }

        .budget-container {
            background: var(--bg);
            border: 2px dashed var(--accent);
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
        }

        #rem { font-size: 38px; font-weight: 900; color: var(--secondary); display: block; margin-bottom: 10px; }

        .limit-input {
            width: 80%; padding: 10px; border: 1px solid var(--accent);
            border-radius: 12px; text-align: center; font-size: 16px;
            background: var(--card-bg); color: var(--text-main);
        }

        input { 
            width: 100%; padding: 14px; margin: 10px 0; 
            border: 2px solid #e2e8f0; border-radius: 15px; 
            font-size: 16px; outline: none; background: var(--card-bg); 
            color: var(--text-main); box-sizing: border-box;
        }

        .btn { 
            border: none; padding: 15px; border-radius: 15px; 
            font-weight: bold; cursor: pointer; width: 100%; 
            font-size: 18px; transition: 0.2s;
        }

        .btn-add { 
            background: var(--accent); color: white; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); margin-top: 10px;
        }

        .btn-clear {
            background: rgba(239, 68, 68, 0.05); color: var(--danger);
            border: 1px solid var(--danger); margin-top: 20px;
            font-size: 14px; padding: 10px;
        }

        .history { margin-top: 25px; text-align: right; max-height: 200px; overflow-y: auto; border-top: 1px solid #eee; }
        .item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.03); }
    </style>
</head>
<body>

<div class="card">
    <h1>Monito - مونيتو</h1>
    <p style="color: #718096; font-size: 14px; margin: 0;">Smart Budgeting 🚀</p>

    <button class="theme-btn" onclick="toggleTheme()" id="theme-text">تغيير للوضع الليلي 🌙</button>

    <div id="auth-section"></div>

    <div class="budget-container">
        <span id="rem">0 EGP</span>
        <input type="number" id="limit" class="limit-input" oninput="updateLimit(this.value)" placeholder="حدد ميزانية الشهر">
    </div>

    <!-- نموذج الإضافة يحتوي على خانة نصية حرة بدلاً من الـ select -->
    <form id="expenseForm">
        <input type="text" id="itemName" placeholder="اكتب اسم الحاجة اللي اشتريتها..." required>
        <input type="number" id="price" placeholder="السعر كام؟" required>
        <button type="submit" class="btn btn-add">إضافة للمصاريف ➕</button>
    </form>

    <div class="history" id="historyList"></div>

    <button onclick="clearAll()" class="btn btn-clear">🗑️ مسح السجل بالكامل</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
// إعدادات Firebase
const firebaseConfig = {
    apiKey: "AIzaSyCpwcIgEsaG_lEhC6Yp6nQ__spGj_ZqnYY",
    authDomain: "monito-c4291.firebaseapp.com",
    projectId: "monito-c4291",
    storageBucket: "monito-c4291.appspot.com",
    appId: "1:366796127553:web:a840f751c322000248b5c0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let list = []; 
let myLimit = 0; 
let currentUser = null;

// دالة تغيير الوضع (ليلي/نهاري)
function toggleTheme() {
    const body = document.documentElement;
    const btnText = document.getElementById('theme-text');
    if(body.getAttribute('data-theme') === 'dark') {
        body.setAttribute('data-theme', 'light');
        btnText.innerHTML = "تغيير للوضع الليلي 🌙";
    } else {
        body.setAttribute('data-theme', 'dark');
        btnText.innerHTML = "تغيير للوضع النهاري ☀️";
    }
}

// عرض البيانات في السجل
function render() {
    const hist = document.getElementById('historyList');
    const rem = document.getElementById('rem');
    
    hist.innerHTML = '';
    let total = 0;

    list.forEach((x, index) => { 
        total += x.a; 
        
        const itemDiv = document.createElement('div');
        itemDiv.className = "item";
        itemDiv.style.display = "flex";
        itemDiv.style.justifyContent = "space-between";
        itemDiv.style.alignItems = "center";
        itemDiv.style.padding = "10px 0";
        
        itemDiv.innerHTML = `
            <span>${x.c} : <b>${x.a} ج.م</b></span>
            <button onclick="deleteItem(${index})" style="background:none; border:none; cursor:pointer; font-size:16px;">🗑️</button>
        `;
        
        hist.prepend(itemDiv);
    });
    
    const finalRem = myLimit - total;
    rem.innerText = finalRem + ' EGP';
    rem.style.color = finalRem < 0 ? "#e53e3e" : "#38a169";
}

// حذف صنف واحد
function deleteItem(index) {
    if(confirm("تمسح الصنف ده؟")) {
        list.splice(index, 1);
        render();
        saveData();
    }
}

// تحديث الميزانية
function updateLimit(val) { 
    myLimit = parseFloat(val) || 0; 
    render(); 
    saveData(); 
}

// حفظ البيانات في Firebase
function saveData() { 
    if(currentUser) {
        db.collection("users").doc(currentUser.uid).set({ 
            expenses: list, 
            limit: myLimit 
        }).catch(error => console.error("Error saving: ", error));
    }
}

// مراقبة حالة تسجيل الدخول
auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        const firstName = user.displayName ? user.displayName.split(' ')[0] : "يوسف";
        document.getElementById('auth-section').innerHTML = `<p style="margin:10px 0;">أهلاً ${firstName} 👋 <span onclick="auth.signOut()" style="cursor:pointer; color:red; font-size:11px; margin-right:10px;">(خروج)</span></p>`;
        
        db.collection("users").doc(user.uid).get().then(doc => {
            if (doc.exists) {
                list = doc.data().expenses || [];
                myLimit = doc.data().limit || 0;
                document.getElementById('limit').value = myLimit;
                render();
            }
        });
    } else {
        document.getElementById('auth-section').innerHTML = `<button onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())" class="btn btn-add" style="background:#4285f4; margin-bottom:20px;">دخول بجوجل 🚀</button>`;
    }
});

// إضافة المصروف الجديد من خانة الـ Input الحرة
document.getElementById('expenseForm').onsubmit = (e) => {
    e.preventDefault();
    const itemNameInput = document.getElementById('itemName');
    const priceInput = document.getElementById('price');
    
    const c = itemNameInput.value.trim();
    const a = parseFloat(priceInput.value);
    
    if(!c || isNaN(a)) {
        alert("يا بطل اكتب اسم الحاجة والسعر صح!");
        return;
    }

    list.push({ c, a }); 
    render(); 
    saveData(); 
    
    // تصفير الخانات بعد الإضافة لتكون جاهزة للعملية اللي بعدها
    itemNameInput.value = '';
    priceInput.value = '';
};

// مسح السجل بالكامل
function clearAll() { 
    if(confirm("أكيد هتمسح السجل بالكامل؟")) { 
        list = []; 
        render(); 
        saveData(); 
    } 
}
</script>
</body>
</html>
